<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/emblem.png" />
    <title>腾云香局</title>
    <script>
      // 值夜主题为默认；渲染前应用，避免闪白
      try {
        document.documentElement.dataset.theme = localStorage.getItem('ty_theme') || 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
